<div class="bg-white p-8 rounded-lg px-16 z-50">
    <h3 class="text-gray-500">Idiomas:</h3>
    <div class="grid grid-cols-4 gap-2" *ngFor="let idioma of idiomas; let i = index; let last = last">
      <div class="grid grid-cols-2 gap-6 col-span-3">
        <div class="relative z-0 w-full mt-6 group">
          <label [for]="'idioma' + i" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Idioma</label>
          <input [name]="'idioma' + i" [(ngModel)]="idioma.idioma" #idioma1="ngModel" maxlength="20"
          [id]="'idioma' + i" type="text" pattern="^[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+$"
          class="bg-gray-50 border border-gray-300 text-gray-500 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
          placeholder="Ingrese un idioma">
        <small *ngIf="idioma1.invalid && idioma1.touched" class="text-red-500">Inválido. Solo se permiten letras.</small>
        </div>
        <div class="relative z-0 w-full mb-5 group">
          <label [for]="'nivel' + i" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Nivel</label>
          <select [name]="'nivel' + i" [(ngModel)]="idioma.nivel" #nivel1="ngModel"
            [id]="'nivel' + i" class="bg-gray-50 border border-gray-300 text-gray-500 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500">
            <option value="Nativo">Nativo</option>
            <option value="Avanzado">Avanzado</option>
            <option value="Intermedio">Intermedio</option>
            <option value="Básico">Básico</option>
          </select>
        </div>
      </div>
      <div class="grid col-span-1">
        <button (click)="removeIdioma(i)" type="button" *ngIf="idiomas.length > 1"
          class="hover:underline text-red-500 font-medium rounded-lg text-sm w-full px-5 py-2.5 text-center">Eliminar
        </button>
  
        <button (click)="addIdioma()" type="button"
          *ngIf="last && nivel1.value != '' && idioma1.value != '' && idiomasReady == false"
          class="text-blue-500 hover:underline font-medium rounded-lg text-sm w-full px-5 py-2.5 text-center">Agregar
        </button>
      </div>
    </div>
  
    <button (click)="idiomasReadyCheck()" type="button" *ngIf="idiomas.length > 1 && idiomasReady == false"
      class="text-blue-500 hover:underline font-medium rounded-lg text-sm w-full px-5 py-2.5 text-center">Listo
    </button>
    <button (click)="idiomasAdd()" type="button" *ngIf="idiomasReady == true"
      class="text-blue-500 hover:underline font-medium rounded-lg text-sm w-full px-5 py-2.5 text-center">Agregar otro
    </button>
  
    <hr>
  
    <h4 class="h3 text-gray-500 mt-10 mb-6">Habilidades:</h4>
    <div class="grid grid-cols-4 gap-2" *ngFor="let habilidad of habilidades; let i = index; let last = last">
      <div class="grid grid-cols-2 gap-6 col-span-3">
        <div class="relative z-0 w-full mb-5 group">
          <label [for]="'habilidad' + i" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Habilidad</label>
          <input [name]="'habilidad' + i" [(ngModel)]="habilidad.habilidad" #habilidad1="ngModel" maxlength="50"
          [id]="'habilidad' + i" type="text" pattern="^[a-zA-Z0-9áéíóúÁÉÍÓÚñÑ\s]*$"
          class="bg-gray-50 border border-gray-300 text-gray-500 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
          placeholder="Ingrese una habilidad">
        <small *ngIf="habilidad1.invalid && habilidad1.touched" class="text-red-500">Inválido. Solo se permiten letras.</small>
        </div>
        <div class="relative z-0 w-full mb-5 group">
          <label [for]="'nivel' + i" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Nivel</label>
          <select [name]="'nivel' + i" [(ngModel)]="habilidad.nivel" #nivel1="ngModel"
            [id]="'nivel' + i" class="bg-gray-50 border border-gray-300 text-gray-500 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500">
            <option value="Experto">Experto</option>
            <option value="Avanzado">Avanzado</option>
            <option value="Intermedio">Intermedio</option>
            <option value="Básico">Básico</option>
          </select>
        </div>
      </div>
  
      <div class="grid col-span-1">
        <button (click)="removeHabilidad(i)" type="button" *ngIf="habilidades.length > 1"
          class="text-red-500 hover:underline font-medium rounded-lg text-sm w-full px-5 py-2.5 text-center">Eliminar
        </button>
        <button (click)="addHabilidad()" type="button"
          *ngIf="last && nivel1.value != '' && habilidad1.value != '' && habilidadesReady == false"
          class="text-blue-500 hover:underline font-medium rounded-lg text-sm w-full px-5 py-2.5 text-center">Agregar
        </button>
      </div>
    </div>
    <button (click)="habilidadReadyCheck()" type="button"
      *ngIf="habilidades.length > 1 && habilidadesReady == false"
      class="text-blue-500 hover:underline font-medium rounded-lg text-sm w-full px-5 py-2.5 text-center">Listo
    </button>
    <button (click)="habilidadAdd()" type="button" *ngIf="habilidadesReady == true"
      class="text-blue-500 hover:underline font-medium rounded-lg text-sm w-full px-5 py-2.5 text-center">Agregar otro
    </button>
    <hr class="mb-5">
  
    <div class="grid grid-cols-2 w-full gap-6">
        <button (click)="back()" type="button"
        class="bg-red-700 hover:bg-red-800 sm:mb-12 text-white float-left focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm w-full sm:w-auto px-5 py-2.5 text-center">Atrás
</button>
  
      <button (click)="next()" type="button"
        [ngClass]="idiomasReady == false || habilidadesReady == false ? 'bg-blue-300' : 'bg-blue-700 hover:bg-blue-800'"
        [disabled]="idiomasReady == false || habilidadesReady == false"
        class="sm:mb-12 text-white float-right focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm w-full sm:w-auto px-5 py-2.5 text-center">Siguiente
      </button>
    </div>
  </div>
