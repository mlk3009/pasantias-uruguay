<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Curriculum</title>
    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
  </head>

  <body>
    <div class="w-full pt-4 font-medium tracking-wide pb-4 flex flex-col items-center justify-center">
      <h1 class="text-4xl text-white text-center">Curriculum</h1>
      <p class="text-md text-gray-500 text-center">
        (Los datos con * son obligatorios)
      </p>
      <button
        class="btn bg-white hover:bg-gray-100 p-2 rounded-lg px-4 mt-2 text-gray-800"
         (click)="modal()"
      >
        Volver al inicio
      </button>
    </div>

    <form class="max-w-2xl mx-auto p-2 mb-12" #fichaForm="ngForm">
      <app-datos-estudiante *ngIf="formPart == 1" />
      <app-educacion *ngIf="formPart == 2" />
      <app-datos-habilidades-idiomas *ngIf="formPart == 3" />
      <app-datos-experiencias *ngIf="formPart == 4" />
      <app-datos-generales *ngIf="formPart == 5" />
    </form>
  </body>

  <img src="../../../assets/img/principalimage_edit2.jpg" class="img">

  <!-- Modal -->
<div id="modal" class="container-modal ">
  <div class="relative">
    <!-- Modal content -->
    <div class="shadow-2xl animate__animated animate__jackInTheBox animate__faster relative p-8 text-center bg-white rounded-lg shadow dark:bg-gray-800 sm:p-5">
      <button (click)="modalClose()" type="button" class="text-gray-400 absolute top-2.5 right-2.5 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm p-1.5 ml-auto inline-flex items-center dark:hover:bg-gray-600 dark:hover:text-white" data-modal-toggle="deleteModal">
        <svg aria-hidden="true" class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
          <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path>
        </svg>
        <span class="sr-only">Close modal</span>
      </button>
      <svg class="text-gray-400 dark:text-gray-500 w-11 h-11 mb-3.5 mx-auto" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12H4m12 0-4 4m4-4-4-4m3-4h2a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3h-2"/>
      </svg>
      
      <p class="mb-4 text-gray-500 dark:text-gray-300">Seguro quieres volver atras?</p>
      <div class="flex justify-center items-center space-x-4">
        <button (click)="modalClose()" data-modal-toggle="deleteModal" type="button" class="py-2 px-3 text-sm font-medium text-gray-500 bg-white rounded-lg border border-gray-200 hover:bg-gray-100 focus:ring-4 focus:outline-none focus:ring-primary-300 hover:text-gray-900 focus:z-10 dark:bg-gray-700 dark:text-gray-300 dark:border-gray-500 dark:hover:text-white dark:hover:bg-gray-600 dark:focus:ring-gray-600">
          No, cancelar
        </button>
        <button (click)="volver()" id="modalButton" type="submit" class="py-2 px-3 text-sm font-medium text-center text-white bg-blue-800 rounded-lg hover:bg-blue-900 focus:ring-4 focus:outline-none focus:ring-blue-300 dark:bg-red-500 dark:hover:bg-red-600 dark:focus:ring-red-900">
          Si, volver
        </button>
      </div>
    </div>
  </div>
</div>
</html>
