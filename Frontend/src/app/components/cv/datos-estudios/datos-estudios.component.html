<div class="bg-white p-8 rounded-lg px-16 z-50">
    <h2 class="text-gray-500 mb-3 text-lg sm:mb-0 pb-1">Estudios:</h2>
    <div *ngFor="let estudio of Estudios; let i = index; let last = last">
        <div class="grid md:grid-cols-2 md:gap-6 col-span-1">
            <!-- cambiar a select -->
            <div class="grid md:grid-cols-2">
                <div class="relative z-0 w-full mb-3 group">
                  <label [for]="'nivel' + i" class="block mb-2 text-sm font-medium text-gray-500 dark:text-white">Nivel *</label>
                  <select autocomplete="off" [(ngModel)]="estudio.nivel" #nivel="ngModel" type="text"
                  pattern="^[^\d]*$" [name]="'nivel' + i" [id]="'nivel' + i" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500 w-60">
                    <option value="ciclo-basico">Ciclo basico</option>
                    <option value="bachillerato">Bachillerato</option>
                    <option value="utu1">UTU (C.Básico)</option>
                    <option value="utu2">UTU (Bachillerato)</option>
                    <option value="utu2">UTU (Bachillerato)</option>
                    <option value="tecnico">Técnico</option>
                    <option value="tecnologo">Tecnólogo</option>
                    <option value="licenciatura">Licenciatura</option>
                    <option value="maestria">Maestría</option>
                    <option value="doctorado">Doctorado</option>
                    <option value="otro">Otro</option>
                  </select>
                </div>
            </div>

            <div class="grid md:grid-cols-2">
                <div class="relative z-0 w-full mb-3 group">
                  <label [for]="'titulo' + i" class="block mb-2 text-sm font-medium text-gray-500 dark:text-white">Título *</label>
                  <select autocomplete="off" type="text" pattern="^[^\d]*$" [name]="'titulo' + i"
                  [id]="'titulo' + i" [(ngModel)]="estudio.titulo" #titulo="ngModel" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500 w-60">
                    <option value="tecnico">Técnico</option>
                    <option value="doctorado">Doctorado</option>
                    <option value="Licenciado">Licenciado</option>
                    <option value="otro">Otro</option>
                  </select>
                </div>
            </div>
        </div>

            <div class="grid md:grid-cols-2">
                <div class="relative z-0 w-full mb-3 group">
                  <label [for]="'institucion' + i" class="block mb-2 text-sm font-medium text-gray-500 dark:text-white">Institución *</label>
                  <select autocomplete="off" type="text" [name]="'institucion' + i"
                  [id]="'institucion' + i" [(ngModel)]="estudio.institucion" #institucion1="ngModel" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500 w-60">
                    <option value="its">ITS</option>
                    <option value="isbo">ISBO</option>
                    <option value="impulso">Impulso</option>
                    <option value="50">Liceo 50</option>
                    <option value="otro">Otro</option>
                  </select>
                </div>
            </div>


        <div class="flex flex-row items-center justify-between mb-4">
            <div id="date-range-picker" date-rangepicker class="flex flex-col">
                <p class="block mb-2 text-sm font-medium text-gray-500 dark:text-white">Inicio</p>
                <div class="relative">
                    <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
                        <svg class="w-4 h-4 text-gray-500 dark:text-gray-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M20 4a2 2 0 0 0-2-2h-2V1a1 1 0 0 0-2 0v1h-3V1a1 1 0 0 0-2 0v1H6V1a1 1 0 0 0-2 0v1H2a2 2 0 0 0-2 2v2h20V4ZM0 18a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8H0v10Zm5-8h10a1 1 0 0 1 0 2H5a1 1 0 0 1 0-2Z"/>
                        </svg>
                    </div>
                    <input [(ngModel)]="estudio.fecha_inicio" #inicio="ngModel"
                    id="datepicker-range-start" name="start" type="text" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full ps-10 p-2.5  dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" placeholder="YYYY/MM/DD">
                    <small *ngIf="inicio.invalid && inicio.touched" class="text-red-500">
                        Inválido.</small>
                </div>
            </div>

            <div id="date-range-picker" date-rangepicker class="flex flex-col">
                <p class="block mb-2 text-sm font-medium text-gray-500 dark:text-white">Final</p>
                <div *ngIf="estudio.actualmente" class="relative">
                    <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
                        <svg class="w-4 h-4 text-gray-500 dark:text-gray-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M20 4a2 2 0 0 0-2-2h-2V1a1 1 0 0 0-2 0v1h-3V1a1 1 0 0 0-2 0v1H6V1a1 1 0 0 0-2 0v1H2a2 2 0 0 0-2 2v2h20V4ZM0 18a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8H0v10Zm5-8h10a1 1 0 0 1 0 2H5a1 1 0 0 1 0-2Z"/>
                        </svg>
                    </div>
                    <input  [(ngModel)]="estudio.fin_estimado" #estimado="ngModel"
                    id="datepicker-range-estimate" name="estimate" type="text" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full ps-10 p-2.5  dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" placeholder="YYYY/MM/DD">
                    <small *ngIf="estimado.invalid && estimado.touched" class="text-red-500">
                        Inválido.</small>
                </div>

                <div *ngIf="!estudio.actualmente" class="relative">
                    <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
                        <svg class="w-4 h-4 text-gray-500 dark:text-gray-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M20 4a2 2 0 0 0-2-2h-2V1a1 1 0 0 0-2 0v1h-3V1a1 1 0 0 0-2 0v1H6V1a1 1 0 0 0-2 0v1H2a2 2 0 0 0-2 2v2h20V4ZM0 18a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8H0v10Zm5-8h10a1 1 0 0 1 0 2H5a1 1 0 0 1 0-2Z"/>
                        </svg>
                    </div>
                    <input [(ngModel)]="estudio.fecha_fin" #fin="ngModel"
                    id="datepicker-range-end" name="end" type="text" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full ps-10 p-2.5  dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" placeholder="YYYY/MM/DD">
                    <small *ngIf="fin.invalid && fin.touched" class="text-red-500">
                    inválido.</small>
                </div>
            </div>
            <div class="flex flex-row items-center pt-10">
                <input class="rounded mr-1" type="checkbox" [name]="'actualmente' + i" [id]="'actualmente' + i" [(ngModel)]="estudio.actualmente">
                <label [for]="'actualmente' + i" class="text-gray-500">Cursando</label>
            </div>
        </div>

        <div class="relative z-0 w-full mb-5 group">
            <textarea autocomplete="off" type="text" pattern="^[^\d]*$" [name]="'descripcion' + i"
                [id]="'estudioPhone' + i" [(ngModel)]="estudio.descripcion" #descripcion="ngModel"
                class="block py-2.5 px-0 w-full text-sm text-gray-900 bg-transparent border-0 border-b-2 border-gray-300 appearance-none dark:text-white dark:border-gray-600 dark:focus:border-blue-500 focus:outline-none focus:ring-0 focus:border-blue-600 peer"
                placeholder=" "></textarea>
            <label [for]="'descripcion' + i"
                class="peer-focus:font-medium absolute text-sm text-gray-500 dark:text-gray-400 duration-300 transform -translate-y-6 scale-75 top-3 -z-10 origin-[0] peer-focus:start-0 rtl:peer-focus:translate-x-1/4 peer-focus:text-blue-600 peer-focus:dark:text-blue-500 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-6">Descripción
            </label>
        </div>
        <div class="grid col-span-1">
            <button (click)="addEstudio()" type="button"
                *ngIf="last && descripcion.value != '' && institucion1.value != '' && nivel.value != '' && descripcion.valid && estudiosReady == false && inicio.valid && estudio.fecha_fin != '' && estudio.fin_estimado != ''"
                class="text-blue-500  font-medium rounded-lg text-sm w-full px-5 py-2.5 text-center">Agregar
            </button>

            <button (click)="removeEstudio(i)" type="button" *ngIf="Estudios.length > 1"
                class="text-red-500 font-medium rounded-lg text-sm w-full px-5 py-2.5 text-center">Eliminar
            </button>
        </div>

        <button (click)="estudioReadyCheck()" type="button" *ngIf="Estudios.length >= 1 && estudiosReady == false"

            [disabled]="estudio.titulo == '' || estudio.nivel == '' || estudio.institucion == '' || estudio.fecha_inicio == '' || estudio.descripcion == ''"
        
            class="text-blue-500 font-medium rounded-lg text-sm w-full px-5 py-2.5 text-center">Listo
        </button>

    </div>

    <button (click)="estudiosAdd()" type="button" *ngIf="estudiosReady == true"
        class="bg-blue-700 text-white font-medium rounded-lg text-sm px-5 py-2.5 mb-2 text-center hover:bg-blue-800">+ Añadir otro
    </button>

    <div class="grid grid-cols-2 w-full gap-6">
        <button (click)="back()" type="button"
            [ngClass]="estudiosReady == false ? 'bg-red-300' : 'bg-red-700 hover:bg-red-800'"
            [disabled]="estudiosReady == false"
            class="sm:mb-12 text-white float-left focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm w-full sm:w-auto px-5 py-2.5 text-center">Atrás
        </button>

        <button (click)="next()" type="button"
            [ngClass]=" estudiosReady == false ? 'bg-blue-300' : 'bg-blue-700 hover:bg-blue-800'"
            [disabled]="estudiosReady == false"
            class="sm:mb-12 text-white float-right focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm w-full sm:w-auto px-5 py-2.5 text-center">Siguiente</button>
    </div>
</div>
