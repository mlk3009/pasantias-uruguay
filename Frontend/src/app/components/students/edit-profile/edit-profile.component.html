<app-nav/>
<div class="body flex items-center justify-center">
    <div class="content bg-gray-50 w-11/12 h-5/6 mt-10 rounded-lg">
      <div class="flex flex-row justify-center w-full">
        <div class="user-data max-w-1/2 flex items-center pt-10 flex-col">
          <div class="flex flex-col items-center">
            <img
              src="../../../../assets/img/user.png"
              alt=""
              class="rounded-full w-40"
            />
            <h1 class="text-gray-900 font-semibold text-4xl mt-5">
              {{ data.name }}
            </h1>
            <h2 class="text-gray-500 text-lg">{{ data.location }}</h2>
          </div>
          <div class="buttons border-b-2 w-4/5 flex justify-center">
            <div class="w-full md:block md:w-auto pt-4">
              <ul
                class="text-center font-medium flex flex-col p-4 md:p-0 mt-4 border border-gray-100 rounded-lg bg-gray-50 md:flex-row md:space-x-8 rtl:space-x-reverse md:mt-0 md:border-0 dark:bg-gray-800 md:dark:bg-gray-900 dark:border-gray-700"
              >
                <li>
                  <a
                    href="/user-profile"
                    class="home_button2 block py-2 px-3 text-gray-800 rounded hover:bg-gray-100 md:hover:bg-transparent md:border-0 md:hover:text-blue-700 md:p-0 dark:text-white md:dark:hover:text-blue-500 dark:hover:bg-gray-700 dark:hover:text-white md:dark:hover:bg-transparent"
                    aria-current="page"
                    >Inicio</a
                  >
                </li>
                <li>
                  <a
                    href="/user-guardados"
                    class="home_button2 block py-2 px-3 text-gray-800 rounded hover:bg-gray-100 md:hover:bg-transparent md:border-0 md:hover:text-blue-700 md:p-0 dark:text-white md:dark:hover:text-blue-500 dark:hover:bg-gray-700 dark:hover:text-white md:dark:hover:bg-transparent"
                    >Guardados</a
                  >
                </li>
                <li>
                  <span
                    class="cursor-not-allowed block py-2 px-3 text-gray-800 rounded hover:bg-gray-100 md:hover:bg-transparent md:border-0 md:hover:text-gray-600 md:p-0 dark:text-white md:dark:hover:text-blue-500 dark:hover:bg-gray-700 dark:hover:text-white md:dark:hover:bg-transparent"
                    aria-disabled="true"
                    >Contacto</span
                  >
                </li>
                <li>
                  <a
                    href="/user-postulations"
                    class="home_button2 block py-2 px-3 text-gray-800 rounded hover:bg-gray-100 md:hover:bg-transparent md:border-0 md:hover:text-blue-700 md:p-0 dark:text-white md:dark:hover:text-blue-500 dark:hover:bg-gray-700 dark:hover:text-white md:dark:hover:bg-transparent"
                    >Postulaciones</a
                  >
                </li>
                <li>
                  <a
                    href="#"
                    class="home_button2 block py-2 px-3 text-gray-800 rounded hover:bg-gray-100 md:hover:bg-transparent md:border-0 md:hover:text-blue-700 md:p-0 dark:text-white md:dark:hover:text-blue-500 dark:hover:bg-gray-700 dark:hover:text-white md:dark:hover:bg-transparent"
                    >Ver CV</a
                  >
                </li>
                <li>
                  <a
                    href="/edit-profile"
                    class="home_button block py-2 px-3 text-white bg-blue-700 rounded md:bg-transparent md:text-blue-700 md:p-0 dark:text-white md:dark:text-blue-500"
                    >Editar perfil</a
                  >
                </li>
              </ul>
            </div>
          </div>
  
          <div class="flex flex-row justify-center max-w-6xl">
            <div class="flex flex-col">
              <div class="flex justify-between flex-row">
                <div class="flex flex-col justify-start">
                  <div class=" flex flex-col">
                    <div class="flex justify-start flex-row">
                      <p class="text-gray-700 text-sm font-semibold p-2 max-w-1/2">
                        Nombre completo: 
                      </p>
                      <input type="text" [value]="data.name" [(ngModel)]="data.name" class="shadow-sm bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500 dark:shadow-sm-light" placeholder="" />
                    </div>
                    
                    <div class="flex justify-start flex-row mt-2">
                      <p class="text-gray-700 text-sm font-semibold p-2 max-w-1/2">
                        Fecha de nacimiento:
                      </p>
                      <input [value]="data.fec_nacimiento" [(ngModel)]="data.fec_nacimiento" type="date" class="shadow-sm bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500 dark:shadow-sm-light" [value]="data.fec_nacimiento"/>
                    </div>
                    
                  </div>
                  <div class="flex flex-col">
                    <div class="flex justify-start flex-row mt-2">
                      <p class="text-gray-700 text-sm font-semibold p-2 max-w-1/2">
                        E-mail:
                      </p>
                      <input type="text" [value]="data.email" [(ngModel)]="data.email" class="shadow-sm bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500 dark:shadow-sm-light" placeholder="" />
                    </div>
                    <div class="flex justify-start flex-row mt-2">
                      <p class="text-gray-700 text-sm font-semibold p-2 max-w-1/2">
                        Teléfono:
                      </p>
                      <input [value]="data.phone" [(ngModel)]="data.phone" type="text" class="shadow-sm bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500 dark:shadow-sm-light" placeholder="" />
                    </div>
                  </div>
                </div>
                <div class="flex flex-col justify-between col2">
                  <div class="flex flex-col">
                    <div class="flex justify-start flex-row">
                      <p class="text-gray-700 text-sm font-semibold p-2 max-w-1/2">
                        Departamento:
                      </p>
                      <select [(ngModel)]="data.location" name="location" id="location" class="shadow-sm bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500 dark:shadow-sm-light">
                        <option [value]="data.location" selected>{{data.location}}</option>
                        <option *ngIf="data.location !== 'Artigas'" value="Artigas">Artigas</option>
                        <option *ngIf="data.location !== 'Canelones'" value="Canelones">Canelones</option>
                        <option *ngIf="data.location !== 'Cerro Largo'" value="Cerro Largo">Cerro Largo</option>
                        <option *ngIf="data.location !== 'Colonia'" value="Colonia">Colonia</option>
                        <option *ngIf="data.location !== 'Durazno'" value="Durazno">Durazno</option>
                        <option *ngIf="data.location !== 'Flores'" value="Flores">Flores</option>
                        <option *ngIf="data.location !== 'Florida'" value="Florida">Florida</option>
                        <option *ngIf="data.location !== 'Lavalleja'" value="Lavalleja">Lavalleja</option>
                        <option *ngIf="data.location !== 'Maldonado'" value="Maldonado">Maldonado</option>
                        <option *ngIf="data.location !== 'Montevideo'" value="Montevideo">Montevideo</option>
                        <option *ngIf="data.location !== 'Paysandú'" value="Paysandú">Paysandú</option>
                        <option *ngIf="data.location !== 'Río Negro'" value="Río Negro">Río Negro</option>
                        <option *ngIf="data.location !== 'Rivera'" value="Rivera">Rivera</option>
                        <option *ngIf="data.location !== 'Rocha'" value="Rocha">Rocha</option>
                        <option *ngIf="data.location !== 'Salto'" value="Salto">Salto</option>
                        <option *ngIf="data.location !== 'San José'" value="San José">San José</option>
                        <option *ngIf="data.location !== 'Soriano'" value="Soriano">Soriano</option>
                        <option *ngIf="data.location !== 'Tacuarembó'" value="Tacuarembó">Tacuarembó</option>
                        <option *ngIf="data.location !== 'Treinta y Tres'" value="Treinta y Tres">Treinta y Tres</option>
                      </select>
                    </div>
                    <div class="flex justify-start flex-row mt-2">
                      <p class="text-gray-700 text-sm font-semibold p-2 max-w-1/2">
                        Puesto de trabajo:
                      </p>
                      <select name="" id="" class="shadow-sm bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500 dark:shadow-sm-light">
                        <option *ngIf="userEtiquetas.length > 0" [value]="userEtiquetas[0].id" selected>{{ userEtiquetas[0].name }}</option>
                        <ng-container *ngFor="let etiqueta of etiquetas">
                          <option *ngIf="etiqueta.id !== userEtiquetas[0]?.id" [value]="etiqueta.id">{{ etiqueta.name }}</option>
                        </ng-container>
                      </select>
                    </div>
                  </div>
                  <div class="flex flex-col">
                    <div class="flex justify-start flex-row mt-2">
                      <p class="readonly-input text-gray-700 text-sm font-semibold p-2 max-w-1/2">
                        Identificación:
                      </p>
                      <input [value]="data.ci_estudiante" type="text" class="readonly-input shadow-sm bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500 dark:shadow-sm-light" placeholder="" readonly />                    </div>
                    <div class="flex justify-start flex-row mt-2">
                      <p class="text-gray-700 text-sm font-semibold p-2 max-w-1/2">
                        Código postal:
                      </p>
                      <input [value]="data.cod_postal" [(ngModel)]="data.cod_postal" type="text" class="shadow-sm bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500 dark:shadow-sm-light" placeholder="" />
                    </div>
                  </div>
                </div>
              </div>
              <div class="pt-20 flex justify-center items-center button">
                <button
                  type="button"
                  (click)="updateProfile()"
                  class="flex flex-row items-center justify-between button1 text-gray-800 bg-gray-50 border border-gray-300 focus:outline-none hover:bg-gray-100 focus:ring-4 focus:ring-gray-100 font-medium rounded-lg text-sm px-5 py-2.5 me-2 mb-2 dark:bg-gray-800 dark:text-white dark:border-gray-600 dark:hover:bg-gray-700 dark:hover:border-gray-600 dark:focus:ring-gray-700"
                >
                  <svg class="w-6 h-6 text-gray-800 dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 11.917 9.724 16.5 19 7.5"/>
                  </svg>
                  Actualizar
                </button>
              
                <button
                  routerLink="/cv"
                  type="button"
                  class="flex flex-row items-center justify-between button1 text-gray-800 bg-gray-50 border border-gray-300 focus:outline-none hover:bg-gray-100 focus:ring-4 focus:ring-gray-100 font-medium rounded-lg text-sm px-5 py-2.5 me-2 mb-2 dark:bg-gray-800 dark:text-white dark:border-gray-600 dark:hover:bg-gray-700 dark:hover:border-gray-600 dark:focus:ring-gray-700"
                >
                  <svg class="w-6 h-6 text-gray-800 dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18 17.94 6M18 18 6.06 6"/>
                  </svg>
                  Cancelar
                </button>
              </div>
            </div>
  
  
  
            <div class="texto ml-2">
              <textarea [value]="data.desc1" [(ngModel)]="data.desc1" id="message"  name="message" ngModel rows="6" class="description block p-2.5 text-sm text-gray-900 bg-gray-50 rounded-lg shadow-sm border border-gray-300 focus:ring-primary-500 focus:border-primary-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500" placeholder="Primer descripción..."></textarea>
              <textarea [value]="data.desc2" [(ngModel)]="data.desc2" id="message2"  name="message2" ngModel rows="6" class="mt-2 description block p-2.5 text-sm text-gray-900 bg-gray-50 rounded-lg shadow-sm border border-gray-300 focus:ring-primary-500 focus:border-primary-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500" placeholder="Segunda descripción..."></textarea>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
