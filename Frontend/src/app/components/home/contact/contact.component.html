<section class="bg-white dark:bg-gray-900 all" id="contact">
<!-- ALERTA CUSTOM -->
<div id="alert-container-custom" style="display:none;position:fixed;top:30px;left:0;right:0;z-index:9999;justify-content:center;align-items:center;pointer-events:none;">
  <div style="background:rgba(30,41,59,0.98);color:#fff;padding:18px 32px;border-radius:12px;box-shadow:0 4px 24px #0008;font-size:1.1em;min-width:220px;max-width:90vw;text-align:center;pointer-events:auto;opacity:0.97;transition:all .3s;" id="alert-custom-message"></div>
</div>
    <div class="py-8 lg:py-16 px-4 mx-auto max-w-screen-md">
        <h2 class="mb-4 text-4xl tracking-tight font-bold text-center text-black dark:text-white">Contáctanos</h2>
        <p class="mb-8 lg:mb-16 font-light text-center text-black dark:text-gray-400 md:text-xl">Has tenido problemas técnicos? Necesitas enviarnos un feedback sobre algo? nesesitas detalles sobre nuestro plan de trabajo? Déjanos saber.</p>
        <form (ngSubmit)="contactUs(subject.value, message.value)" #contactForm="ngForm" class="space-y-8">
            <div>
                <label for="subject" class="block mb-2 text-sm font-medium text-gray-900 dark:text-gray-300">Asunto</label>
                <input type="text" id="subject" #subject="ngModel" name="subject" ngModel class="block p-3 w-full text-sm text-gray-900 bg-gray-50 rounded-lg border border-gray-300 shadow-sm focus:ring-primary-500 focus:border-primary-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500 dark:shadow-sm-light" placeholder="Cómo podemos ayudarte" required>
            </div>
            <div class="sm:col-span-2">
                <label for="message" class="block mb-2 text-sm font-medium text-gray-900 dark:text-gray-400">Mensaje</label>
                <textarea id="message" #message="ngModel" name="message" ngModel rows="6" class="block p-2.5 w-full text-sm text-gray-900 bg-gray-50 rounded-lg shadow-sm border border-gray-300 focus:ring-primary-500 focus:border-primary-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500" placeholder="Deja un comentario..."></textarea>
            </div>
            <button type="submit" [disabled]="!isLoggedIn || isLoading" class="button1 py-3 px-5 text-sm font-semibold text-center text-black rounded-lg bg-primary-700 sm:w-fit hover:bg-primary-800 focus:ring-4 focus:outline-none focus:ring-primary-300 dark:bg-primary-600 dark:hover:bg-primary-700 dark:focus:ring-primary-800 flex items-center justify-center min-w-[140px]">
                <span *ngIf="!isLoading">Enviar mensaje</span>
                <span *ngIf="isLoading" class="flex items-center justify-center">
                  <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
                  </svg>
                </span>
            </button>
            <p *ngIf="!isLoggedIn" class="text-sm text-gray-500 dark:text-gray-400">Necesitas estar logueado para acceder a esta función.</p>
        </form>
    </div>
</section>
