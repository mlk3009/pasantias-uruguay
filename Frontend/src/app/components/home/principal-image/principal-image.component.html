<head>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
  </head>
<section id="inicio" class="principalImage lowwave">
  <!-- ALERTA CUSTOM -->
  <div id="alert-container-custom" style="display:none;position:fixed;top:30px;left:0;right:0;z-index:9999;justify-content:center;align-items:center;pointer-events:none;">
    <div 
      id="alert-custom-message"
      style="background:rgba(30,41,59,0.98);color:#fff;padding:18px 32px;border-radius:12px;box-shadow:0 4px 24px #0008;font-size:1.1em;min-width:220px;max-width:90vw;text-align:center;pointer-events:auto;opacity:0.97;transition:all .3s;"
      class="modal-responsive"
    >
      <div class="compra-opciones">
        <!-- Ejemplo de opciones de compra, reemplaza por tu contenido real -->
        <button class="compra-btn">Comprar opción 1</button>
        <button class="compra-btn">Comprar opción 2</button>
        <button class="compra-btn">Comprar opción 3</button>
      </div>
    </div>
<style>
@media (max-width: 600px) {
  #alert-container-custom {
    top: 0 !important;
    left: 0 !important;
    right: 0 !important;
    bottom: 0 !important;
    height: 100vh !important;
    align-items: center !important;
    justify-content: center !important;
    padding: 0 !important;
  }
  #alert-custom-message, .modal-responsive {
    min-width: 0 !important;
    max-width: 95vw !important;
    font-size: 1em !important;
    padding: 22px 10px !important;
    border-radius: 16px !important;
    word-break: break-word !important;
    box-sizing: border-box !important;
    height: auto !important;
    max-height: 90vh !important;
    overflow-y: auto !important;
    display: flex !important;
    flex-direction: column !important;
    justify-content: center !important;
    align-items: center !important;
  }
  .compra-opciones {
    display: flex !important;
    flex-direction: column !important;
    gap: 16px !important;
    width: 100%;
    align-items: center;
    margin-top: 10px;
  }
  .compra-btn {
    width: 90%;
    padding: 12px 0;
    font-size: 1em;
    border-radius: 8px;
    background: #2563eb;
    color: #fff;
    border: none;
    box-shadow: 0 2px 8px #0002;
  }
}

@media (min-width: 601px) {
  #dropdown-button {
    border-top-left-radius: 12px !important;
    border-bottom-left-radius: 12px !important;
  }
}
</style>
  </div>
    <h1 class="animate__animated animate__backInDown animate__faster max-w-96 md:max-w-xl mx-auto">¡Es momento de un rumbo diferente!</h1>
    <div class="searcher mx-auto">
      <form (ngSubmit)="buscarPublicaciones(filtroForm.value)" #filtroForm="ngForm" class="max-w-2xl w-full mx-auto">
        <div class="flex flex-col gap-2 w-full sm:flex-row sm:gap-0">
          <!-- Dropdown Lugar -->
          <div style="position: relative;" class="w-full sm:w-auto mb-2 sm:mb-0">
            <button
              id="dropdown-button"
              (click)="toggleDropdown()"
              class="flex-shrink-0 z-10 inline-flex items-center py-3 px-3 text-base font-medium text-center text-gray-900 bg-gray-100 border border-gray-300 rounded-t-lg sm:rounded-s-lg sm:rounded-t-none hover:bg-gray-200 dark:bg-gray-700 dark:hover:bg-gray-600 dark:focus:ring-gray-700 dark:text-white dark:border-gray-600 w-full sm:w-32 truncate"
              type="button"
            >
              <span class="truncate block max-w-full">{{ selectedLugar }}</span>
              <svg class="w-2.5 h-2.5 ms-2.5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 10 6">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 4 4 4-4"/>
              </svg>
            </button>
            <!-- Limpiar selección -->
            <div *ngIf="isDropdownOpen" style="position: absolute; top: 100%; left: 0; max-height: 200px; overflow-y: auto; width: 180px; z-index: 50;" class="bg-white border border-gray-300 rounded shadow">
              <ul style="min-width: 200px;">
                <li *ngFor="let dep of departamentos">
                  <button type="button" (click)="selectLugar(dep)" [value]="dep" class="inline-flex w-full px-4 py-2 text-left hover:bg-gray-100 dark:hover:bg-gray-600 dark:hover:text-white">{{ dep }}</button>
                </li>
              </ul>
            </div>
          </div>
          <input type="hidden" name="location" [(ngModel)]="selectedLugar" />
          <!-- Input de búsqueda -->
          <div class="relative w-full">
            <input type="search" id="search-dropdown" name="search" ngModel class="block p-3 w-full min-w-[220px] sm:min-w-[280px] md:min-w-[340px] lg:min-w-[420px] z-20 text-base text-gray-900 bg-gray-50 rounded-b-lg sm:rounded-e-lg sm:rounded-b-none border-s-gray-50 border-s-2 border border-gray-300 dark:bg-gray-700 dark:border-s-gray-700  dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:border-blue-500" placeholder="Cargo o empresa" required />
            <button type="submit" class="button1 absolute top-0 end-0 p-3 text-base font-medium h-full text-white bg-blue-700 rounded-e-lg border border-goldenrod hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">
              <svg class="w-4 h-4" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 20">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m19 19-4-4m0-7A7 7 0 1 1 1 8a7 7 0 0 1 14 0Z"/>
              </svg>
              <span class="sr-only">Search</span>
            </button>
          </div>
        </div>
      </form>
    </div>
    <div class="lowwave">
        <h2>Encuentra el empleo que necesitas</h2>
        <div class="w-full stats">
            <div id="fullWidthTabContent" class="bg-transparent dark:border-gray-600">
                <div class="p-4 md:p-8 dark:bg-gray-800" id="stats" role="tabpanel" aria-labelledby="stats-tab">
                    <dl class="bg-transparent grid max-w-screen-xl grid-cols-2 gap-8 p-4 mx-auto text-gray-900 sm:grid-cols-3 xl:grid-cols-6 dark:text-white sm:p-8">
                        <div class="bg-transparent flex flex-col items-center justify-center">
                            <dt class="font bg-transparent text-white mb-2 text-3xl font-bold">{{ clientes }}</dt>
                            <dd class="bg-transparent text-white dark:text-gray-400">Clientes</dd>
                        </div>
                        <div class="bg-transparent flex flex-col items-center justify-center">
                            <dt class="font bg-transparent text-white mb-2 text-3xl font-bold">{{ empresasAfiliadas }}</dt>
                            <dd class="bg-transparent text-white dark:text-gray-400">Empresas afiliadas</dd>
                        </div>
                        <div class="bg-transparent flex flex-col items-center justify-center">
                            <dt class="font bg-transparent text-white mb-2 text-3xl font-bold">{{ llamadosLaborales }}</dt>
                            <dd class="bg-transparent text-white dark:text-gray-400">Llamados laborales</dd>
                        </div>
                        <div class="bg-transparent flex flex-col items-center justify-center">
                            <dt class="font bg-transparent text-white mb-2 text-3xl font-bold">{{ recomendaciones }}</dt>
                            <dd class="bg-transparent text-white dark:text-gray-400">Recomendaciones</dd>
                        </div>
                        <div class="bg-transparent flex flex-col items-center justify-center">
                            <dt class="font bg-transparent text-white mb-2 text-3xl font-bold">{{ utusAfiliadas }}</dt>
                            <dd class="bg-transparent text-white dark:text-gray-400">UTUs afiliadas</dd>
                        </div>
                        <div class="bg-transparent flex flex-col items-center justify-center">
                            <dt class="font bg-transparent text-white mb-2 text-3xl font-bold">{{ operadoresActivos }}</dt>
                            <dd class="bg-transparent text-white dark:text-gray-400">Operadores activos</dd>
                        </div>
                    </dl>
                </div>
            </div>
        </div>
    </div>
    <div class="a">
      <div class="svg-bottom-bg">
        <svg viewBox="0 0 500 150" preserveAspectRatio="none" style="height: 100%; width: 100%;"><path d="M-13.88,58.56 C150.00,149.60 333.18,-17.22 518.28,91.03 L512.07,168.79 L-7.67,177.65 Z" style="stroke: none; fill: rgb(255, 255, 255);"></path></svg>
      </div>
    </div>
</section>
